<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Advanced 3D asset placement fixture</title>
    <style>
      html,body,#viewer{width:100%;height:100%;margin:0;background:#071118;overflow:hidden}
      #controls{position:fixed;z-index:10;top:12px;left:12px;display:flex;gap:6px;align-items:center;padding:8px;background:#071118dd;border:1px solid #8dd8c533;border-radius:7px;color:#cde7e2;font:11px ui-monospace,monospace}
      button{padding:7px 10px;color:#cde7e2;background:#102833;border:1px solid #8dd8c544;border-radius:4px;cursor:pointer}
      output{white-space:pre-line;opacity:.72}
    </style>
  </head>
  <body>
    <div id="viewer"></div><div id="controls"></div>
    <script type="module" src="/scripts/asset-placement-fixture.js"></script>
  </body>
</html>
